[package]
name = "Relay"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jwt = "0.16.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
simple_dto_mapper_derive = "0.1.1"
sqlx = {version = "0.9.0", features = ["runtime-tokio", "any", "postgres", "chrono", "uuid", "json", "migrate"]}
thiserror = "2.0.21"
tokio = {version = "1.0", features = ["full"]}
tokio-postgres = "0.7.18"
tower = "0.5.2"
tower-http = "0.6.1"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
validator = "0.21.0"
# utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[dev-dependencies]
http-body-util = { version = "0.1.5", features = ["full"]}
