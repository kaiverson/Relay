[package]
name = "Relay"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
jwt = "0.16.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
sqlx = {version = "0.9.0", features = ["runtime-tokio", "any", "postgres"]}
tokio = {version = "1.0", features = ["full"]}
tokio-postgres = "0.7.18"
tower = "0.5.2"
tower-http = "0.6.1"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
# utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[dev-dependencies]
http-body-util = { version = "0.1.5", features = ["full"]}
